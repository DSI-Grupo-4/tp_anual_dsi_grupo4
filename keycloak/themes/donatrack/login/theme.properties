# Tema de login de DonaTrack (Entrega 6, fase 7 de la Persona 1).
# Hereda de keycloak.v2 (PatternFly 5) y le agrega los tokens de diseño de servicio-web.
# resources/css/tokens.css es una COPIA de servicio-web/src/main/resources/static/css/tokens.css:
# un test de servicio-web (TemaKeycloakTest) falla si dejan de ser iguales.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/tokens.css css/donatrack.css
darkMode=false
locales=es,en
