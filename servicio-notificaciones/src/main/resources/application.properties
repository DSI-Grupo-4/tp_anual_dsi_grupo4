server.port=8082
spring.application.name=servicio-notificaciones

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2

# --- Base de datos: un único MySQL, esquema (base) "notificaciones" ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notificaciones}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=BasededatosTP1

# validate: las tablas las crea db/notificaciones.sql; Hibernate solo comprueba que coincidan
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# --- Email (SMTP). Por defecto Mailpit local; para Gmail cambiar host, puerto y credenciales ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
notificaciones.email.remitente=${MAIL_REMITENTE:no-responder@donatrack.local}

# --- Twilio (SMS y WhatsApp). Sin credenciales, se simulan los envíos ---
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.numero-sms=${TWILIO_NUMERO_SMS:}
twilio.numero-whatsapp=${TWILIO_NUMERO_WHATSAPP:+14155238886}
twilio.whatsapp-content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
twilio.sms-cuerpo-prueba=${TWILIO_SMS_CUERPO_PRUEBA:}
twilio.whatsapp-activo=${TWILIO_WHATSAPP_ACTIVO:true}