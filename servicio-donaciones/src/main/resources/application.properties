spring.application.name=servicio-donaciones

# Swagger: login de usuario con Authorization Code y PKCE, sin client secret.
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
server.port=8080

# Default de Spring es 1MB/10MB -- el CSV de ejemplo de importacion masiva
# de donantes (servicio-donaciones/src/data) ya pesa 1.76MB por si solo,
# asi que con el default el endpoint /api/donantes/importar fallaba con
# cualquier archivo real.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Base de datos: un único MySQL, esquema (base) "donaciones" ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:donaciones}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=BasededatosTP1

# validate: las tablas las crea db/donaciones.sql (montado en
# docker-entrypoint-initdb.d, corre solo en un volumen de MySQL nuevo).
# Hibernate valida que las entidades coincidan con ese esquema, no lo toca.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Las respuestas serializan entidades con colecciones lazy (medios de
# contacto, items, historial de estados): necesitan la sesión abierta
# durante el request.
spring.jpa.open-in-view=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

logistica.proveedores.propia-url=${LOGISTICA_PROPIA_URL:http://localhost:8083}
logistica.proveedores.alternativa-url=${LOGISTICA_ALTERNATIVA_URL:https://tp-anual-dsi-grupo4-1.onrender.com}
logistica.broker.estrategia=${LOGISTICA_BROKER_ESTRATEGIA:ROUND_ROBIN}
logistica.eventos.poll-delay-ms=60000
logistica.envio.cron=0 30 2 * * *

incentivos.base-url=${INCENTIVOS_BASE_URL:http://localhost:8081}

donantes.inactividad.cron=0 0 4 * * *

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

notificaciones.administradores.emails=${NOTIFICACIONES_ADMIN_EMAILS:}

# --- Seguridad (Entrega 6, D-045/D-046) ---
# false: la API queda abierta como antes y no se piden tokens (desarrollo sin Keycloak).
donatrack.seguridad.habilitada=${SEGURIDAD_HABILITADA:false}
# Desde donde se bajan las claves y se piden tokens. El issuer es el que figura en los tokens.
donatrack.seguridad.keycloak-url=${KEYCLOAK_URL:http://localhost:8180}
donatrack.seguridad.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/donatrack}
# Clientes cuyos tokens client_credentials cuentan como SERVICIO (landing de servicio-web, Incentivos).
donatrack.seguridad.clientes-servicio=servicio-web,servicio-incentivos
# Cliente confidencial de este servicio; el secret va en servicio-donaciones/.env, no se versiona.
donatrack.seguridad.client-id=servicio-donaciones
donatrack.seguridad.client-secret=${KEYCLOAK_CLIENT_SECRET:}
# Destino del link del mail de acceso que manda Keycloak a las cuentas nuevas.
donatrack.web-url=${DONATRACK_WEB_URL:http://localhost:8085}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
