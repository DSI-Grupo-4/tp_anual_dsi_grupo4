include:
  - servicio-incentivos/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: donatrack-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mysql:
    image: mysql:8
    container_name: donatrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: BasededatosTP1
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pBasededatosTP1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
      - ./servicio-incentivos/src/main/resources/db/incentivos.sql:/docker-entrypoint-initdb.d/02-incentivos.sql:ro
      - ./servicio-donaciones/src/main/resources/db/donaciones.sql:/docker-entrypoint-initdb.d/03-donaciones.sql:ro
      - ./servicio-notificaciones/src/main/resources/db/notificaciones.sql:/docker-entrypoint-initdb.d/04-notificaciones.sql:ro
  # Persistencia documental de Logística (Entrega 5): MongoDB, base "logistica".
  # GeneradorIds asigna los IDs enteros al primer save (ver Camion/Chofer/Entrega/Ruta);
  # no se depende del ObjectId de Mongo para no romper el contrato de la API ni el broker con Donaciones.
  mongo:
    image: mongo:7
    container_name: donatrack-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db
  # Consola de administración de la base (D-012 preveía MySQL Workbench,
  # pero es una app de escritorio -- no es un buen ciudadano de Docker,
  # necesitaría X11/VNC. Adminer es la alternativa web estándar, imagen
  # oficial, un solo contenedor sin configuración adicional).
  adminer:
    image: adminer:latest
    container_name: donatrack-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
  # Servidor SMTP de prueba: recibe los emails de Notificaciones y los muestra en una bandeja web
  mailpit:
    image: axllent/mailpit:latest
    container_name: donatrack-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP: por acá entra el mail
      - "8025:8025"   # Bandeja web: http://localhost:8025
volumes:
  rabbitmq-data:
  mysql-data:
  mongo-data:
