include:
  - servicio-incentivos/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: donatrack-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mysql:
    image: mysql:8
    container_name: donatrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: BasededatosTP1
      MYSQL_DATABASE: logistica
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pBasededatosTP1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
      - ./servicio-logistica/src/main/resources/db/logistica.sql:/docker-entrypoint-initdb.d/01-logistica.sql:ro
      - ./servicio-incentivos/src/main/resources/db/incentivos.sql:/docker-entrypoint-initdb.d/02-incentivos.sql:ro

  # Consola de administración de la base (D-012 preveía MySQL Workbench,
  # pero es una app de escritorio -- no es un buen ciudadano de Docker,
  # necesitaría X11/VNC. Adminer es la alternativa web estándar, imagen
  # oficial, un solo contenedor sin configuración adicional).
  adminer:
    image: adminer:latest
    container_name: donatrack-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rabbitmq-data:
  mysql-data:
