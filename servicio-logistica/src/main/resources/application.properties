server.port=${PORT:8083}
spring.application.name=servicio-logistica
logistica.planificacion.cron=0 0 3 * * *
logistica.public-base-url=${LOGISTICA_PUBLIC_BASE_URL:http://localhost:8083}

# --- Base de datos: un único MySQL, esquema (base) "logistica" ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:logistica}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=BasededatosTP1

# validate: las tablas las crea db/logistica.sql (montado en
# docker-entrypoint-initdb.d, corre solo en un volumen de MySQL nuevo).
# Hibernate valida que las entidades coincidan con ese esquema, no lo toca.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Las respuestas serializan entidades con colecciones lazy (paradas, entregas, fotos):
# necesitan la sesión abierta durante el request.
spring.jpa.open-in-view=true
