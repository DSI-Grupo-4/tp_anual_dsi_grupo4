server.port=${PORT:8083}
spring.application.name=servicio-logistica

# Swagger: login de usuario con Authorization Code y PKCE, sin client secret.
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
logistica.planificacion.cron=0 0 3 * * *
logistica.public-base-url=${LOGISTICA_PUBLIC_BASE_URL:http://localhost:8083}

# --- Base de datos documental (Entrega 5): MongoDB, base "logistica" ---
# La URI (con usuario y contraseña si es Atlas) va en la variable de entorno MONGODB_URI; no se commitea.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/logistica}
# Crea los índices declarados con @Indexed (patente, dni y donación únicos, etc.)
spring.data.mongodb.auto-index-creation=true
# Necesario para guardar UUID (id de EventoLogistico) en un formato estándar
spring.data.mongodb.uuid-representation=standard

# --- Simulador de ubicación del camión (solo para la demo) ---
# Punto de partida cuando el camión todavía no informó ninguna ubicación: Ciudad de Buenos Aires.
logistica.simulador.deposito-lat=-34.6037
logistica.simulador.deposito-lng=-58.3816
# Qué parte de la distancia que falta hasta la próxima parada recorre el camión en cada paso.
logistica.simulador.fraccion-por-paso=0.25
# A esta distancia de la parada (en km) se considera que el camión llegó.
logistica.simulador.umbral-llegada-km=0.15
# Si una parada no tiene coordenadas, usar un punto de ejemplo cercano al depósito (true) o rechazar el paso (false).
logistica.simulador.usar-puntos-de-ejemplo=true

# --- Fotos de las entregas (GridFS en MongoDB) ---
# Tamaño máximo de una foto (bytes). El límite de Spring es un poco mayor para que este mensaje llegue al usuario.
logistica.fotos.max-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# --- Seguridad (Entrega 6, D-045) ---
# false: la API queda abierta como antes (desarrollo sin Keycloak y despliegue en Render).
donatrack.seguridad.habilitada=${SEGURIDAD_HABILITADA:false}
donatrack.seguridad.keycloak-url=${KEYCLOAK_URL:http://localhost:8180}
donatrack.seguridad.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/donatrack}
# Clientes cuyos tokens client_credentials cuentan como SERVICIO.
donatrack.seguridad.clientes-servicio=servicio-donaciones,servicio-web
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
