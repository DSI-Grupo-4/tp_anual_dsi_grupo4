server.port=8081
spring.application.name=servicio-incentivos
incentivos.webhook.n8n-url=${INCENTIVOS_WEBHOOK_N8N_URL:http://localhost:5678/webhook/events/insignia-otorgada}

# --- Base de datos: un único MySQL, esquema (base) "incentivos" ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:incentivos}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=BasededatosTP1

# validate: las tablas las crea db/incentivos.sql (montado en
# docker-entrypoint-initdb.d, corre solo en un volumen de MySQL nuevo).
# Hibernate valida que las entidades coincidan con ese esquema, no lo toca.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Las respuestas serializan entidades con colecciones lazy (misiones,
# progreso, historial): necesitan la sesión abierta durante el request.
spring.jpa.open-in-view=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recuperación de perfiles anteriores al alta integrada
donaciones.base-url=${DONACIONES_BASE_URL:http://localhost:8080}
