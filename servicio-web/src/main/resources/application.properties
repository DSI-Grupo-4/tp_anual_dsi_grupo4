server.port=8085
spring.application.name=servicio-web

# --- APIs consumidas (D-041). Cada una se puede pisar por variable de entorno. ---
donatrack.api.donaciones.url=${DONACIONES_API_URL:http://localhost:8080}
donatrack.api.incentivos.url=${INCENTIVOS_API_URL:http://localhost:8081}
donatrack.api.logistica.url=${LOGISTICA_API_URL:http://localhost:8083}
# Tiempos máximos por llamada. Si un backend no responde, la vista muestra
# la página de "servicio no disponible" en vez de quedarse colgada.
donatrack.api.timeout-conexion=${API_TIMEOUT_CONEXION:2s}
donatrack.api.timeout-lectura=${API_TIMEOUT_LECTURA:5s}

# Las APIs guardan y devuelven fechas en UTC (D-037); se muestran en esta zona.
donatrack.web.zona-horaria=America/Argentina/Buenos_Aires

# Textos de la interfaz (etiquetas, ayudas, mensajes).
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Sin la página de error por defecto de Spring: las páginas propias están en templates/error/.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# --- Mapa (D-042): Leaflet + tiles de OpenStreetMap. Se puede cambiar de proveedor sin tocar código. ---
donatrack.web.mapa.tiles-url=${MAPA_TILES_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
donatrack.web.mapa.atribucion=${MAPA_ATRIBUCION:&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors}
# Centro por defecto cuando no hay marcadores: Ciudad de Buenos Aires.
donatrack.web.mapa.centro-lat=-34.6037
donatrack.web.mapa.centro-lng=-58.3816
donatrack.web.mapa.zoom=11

# --- Autenticación (Persona 2) ---
# Destino del botón "Crear cuenta" de /registro. Cuando el cliente OIDC exista, apuntarlo al
# registro de Keycloak, por ejemplo:
#   http://localhost:8180/realms/donatrack/protocol/openid-connect/registrations?client_id=servicio-web&response_type=code&scope=openid&redirect_uri=http://localhost:8085/login/oauth2/code/keycloak
donatrack.web.auth.registro-url=${AUTH_REGISTRO_URL:/ingresar}
