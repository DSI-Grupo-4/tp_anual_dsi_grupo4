server.port=8085
spring.application.name=servicio-web

# --- APIs consumidas (D-041). Cada una se puede pisar por variable de entorno. ---
donatrack.api.donaciones.url=${DONACIONES_API_URL:http://localhost:8080}
donatrack.api.incentivos.url=${INCENTIVOS_API_URL:http://localhost:8081}
donatrack.api.logistica.url=${LOGISTICA_API_URL:http://localhost:8083}
# Tiempos máximos por llamada. Si un backend no responde, la vista muestra
# la página de "servicio no disponible" en vez de quedarse colgada.
donatrack.api.timeout-conexion=${API_TIMEOUT_CONEXION:2s}
donatrack.api.timeout-lectura=${API_TIMEOUT_LECTURA:5s}

# Las APIs guardan y devuelven fechas en UTC (D-037); se muestran en esta zona.
donatrack.web.zona-horaria=America/Argentina/Buenos_Aires

# Textos de la interfaz (etiquetas, ayudas, mensajes).
spring.messages.basename=messages,messages-beneficiaria,messages-logistica
spring.messages.encoding=UTF-8

# Sin la página de error por defecto de Spring: las páginas propias están en templates/error/.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# --- Mapa (D-042): Leaflet + tiles de OpenStreetMap. Se puede cambiar de proveedor sin tocar código. ---
donatrack.web.mapa.tiles-url=${MAPA_TILES_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
donatrack.web.mapa.atribucion=${MAPA_ATRIBUCION:&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors}
# Centro por defecto cuando no hay marcadores: Ciudad de Buenos Aires.
donatrack.web.mapa.centro-lat=-34.6037
donatrack.web.mapa.centro-lng=-58.3816
donatrack.web.mapa.zoom=11

# --- Autenticación (Persona 2) ---
# Destino del botón "Crear cuenta" de /registro: abre el formulario de registro de Keycloak
# (prompt=create, ver SeguridadConfig). Keycloak pide verificar el correo por Mailpit.
donatrack.web.auth.registro-url=${AUTH_REGISTRO_URL:/oauth2/authorization/keycloak?registro}
# true: las llamadas a las APIs llevan el token del usuario (o el de servicio en la landing).
# Tiene que coincidir con SEGURIDAD_HABILITADA de los servicios.
donatrack.web.auth.propagar-token=${SEGURIDAD_HABILITADA:false}
# Issuer http://localhost:8180/realms/donatrack. No se usa issuer-uri de Spring: esa opción
# consulta a Keycloak al arrancar y el cliente web no levantaría con Keycloak apagado.
donatrack.web.auth.keycloak-url=${KEYCLOAK_URL:http://localhost:8180}
# Client secret del cliente confidencial "servicio-web". Sale de la consola (Credentials)
# y no se versiona. Sin este valor el login llega a Keycloak pero falla al canjear el código.
donatrack.web.auth.client-secret=${KEYCLOAK_CLIENT_SECRET:}
# La cookie de sesión no se llama JSESSIONID: ese nombre lo comparten los otros servicios
# y, como la cookie no distingue puertos, Swagger en el 8080 podía pisar la sesión del 8085.
server.servlet.session.cookie.name=DONATRACK_SESSION

# --- Portal de la entidad beneficiaria (Persona 5) ---
# Entidad con la que opera el portal mientras no exista la autenticación (Persona 2). Se elimina al integrarla.
donatrack.web.beneficiaria.entidad-id=${BENEFICIARIA_ENTIDAD_ID:1}

# --- Fotos de la confirmación de recepción (Persona 5) ---
# El controlador valida 5 MB por foto y hasta 5 fotos; estos límites son un tope más alto para cortar abusos.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=32MB
