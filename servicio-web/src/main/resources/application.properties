server.port=8085
spring.application.name=servicio-web

# --- APIs consumidas (D-041). Cada una se puede pisar por variable de entorno. ---
donatrack.api.donaciones.url=${DONACIONES_API_URL:http://localhost:8080}
donatrack.api.incentivos.url=${INCENTIVOS_API_URL:http://localhost:8081}
donatrack.api.logistica.url=${LOGISTICA_API_URL:http://localhost:8083}
# Tiempos máximos por llamada. Si un backend no responde, la vista muestra
# la página de "servicio no disponible" en vez de quedarse colgada.
donatrack.api.timeout-conexion=${API_TIMEOUT_CONEXION:2s}
donatrack.api.timeout-lectura=${API_TIMEOUT_LECTURA:5s}

# Las APIs guardan y devuelven fechas en UTC (D-037); se muestran en esta zona.
donatrack.web.zona-horaria=America/Argentina/Buenos_Aires

# Textos de la interfaz (etiquetas, ayudas, mensajes).
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Sin la página de error por defecto de Spring: las páginas propias están en templates/error/.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
