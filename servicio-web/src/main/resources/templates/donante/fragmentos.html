<!DOCTYPE html>
<!-- Fragmentos comunes del portal del donante (Persona 4). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="recursos">
  <link rel="stylesheet" th:href="@{/css/incentivos.css}">
  <link rel="stylesheet" th:href="@{/css/donante.css}">
</th:block>

<!-- Recursos de una pantalla del portal con mapa (seguimiento): el componente de mapa más los estilos del portal. -->
<th:block th:fragment="recursosConMapa">
  <th:block th:replace="~{fragments/mapa :: recursos}"></th:block>
  <th:block th:replace="~{donante/fragmentos :: recursos}"></th:block>
</th:block>

<!-- Insignia de estado de una donación. -->
<span th:fragment="estado(estado)" th:class="${@donanteVista.claseEstado(estado)}"
      th:text="${@donanteVista.estado(estado)}">En depósito</span>
</body>
</html>
