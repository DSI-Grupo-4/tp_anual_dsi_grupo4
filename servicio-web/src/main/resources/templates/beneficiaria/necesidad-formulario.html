<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/privado :: layout(#{nav.beneficiaria.necesidades}, ~{::contenido}, _)}">
<body>
<th:block th:fragment="contenido">
  <div class="cabecera-pagina">
    <div>
      <h1 th:if="${necesidadId == null}" th:text="#{beneficiaria.necesidades.form.titulo-nueva}">Nueva necesidad</h1>
      <h1 th:if="${necesidadId != null}" th:text="#{beneficiaria.necesidades.form.titulo-editar}">Editar necesidad</h1>
      <p th:text="${form.esRecurrente()} ? #{beneficiaria.necesidades.form.bajada-recurrente} : #{beneficiaria.necesidades.form.bajada-extraordinaria}">Bajada</p>
    </div>
  </div>

  <form class="tarjeta formulario" method="post" novalidate
        th:object="${form}"
        th:action="${necesidadId == null} ? @{/beneficiaria/necesidades} : @{/beneficiaria/necesidades/{id}(id=${necesidadId})}">

    <!-- Errores que no son de un campo (por ejemplo, un rechazo de Donaciones) -->
    <div class="banner banner--error" role="alert" th:if="${#fields.hasGlobalErrors()}">
      <th:block th:replace="~{fragments/comunes :: icono('alerta')}"/>
      <div class="banner__contenido">
        <p class="banner__titulo" th:text="#{beneficiaria.necesidades.form.no-guardada}">No se pudo guardar</p>
        <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</span>
      </div>
    </div>

    <input type="hidden" th:field="*{tipo}">

    <div class="campo">
      <label class="campo__etiqueta" for="descripcion">
        <span th:text="#{beneficiaria.necesidades.form.descripcion}">Descripción</span>
        <span class="campo__obligatorio" aria-hidden="true">*</span>
      </label>
      <input class="control" id="descripcion" type="text" th:field="*{descripcion}" maxlength="200" required
             th:attr="aria-invalid=${#fields.hasErrors('descripcion')},
                      aria-describedby=${#fields.hasErrors('descripcion')} ? 'descripcion-error' : 'descripcion-ayuda'">
      <span class="campo__ayuda" id="descripcion-ayuda" th:unless="${#fields.hasErrors('descripcion')}"
            th:text="#{beneficiaria.necesidades.form.descripcion-ayuda}">Ayuda</span>
      <span class="campo__error" id="descripcion-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error</span>
    </div>

    <div class="formulario__fila">
      <div class="campo">
        <label class="campo__etiqueta" for="subcategoria">
          <span th:text="#{beneficiaria.necesidades.form.subcategoria}">Subcategoría</span>
          <span class="campo__obligatorio" aria-hidden="true">*</span>
        </label>
        <select class="control" id="subcategoria" th:field="*{subcategoria}" required
                th:attr="aria-invalid=${#fields.hasErrors('subcategoria')},
                         aria-describedby=${#fields.hasErrors('subcategoria')} ? 'subcategoria-error' : null">
          <option value="" th:text="#{beneficiaria.necesidades.form.elegir}">Elegí una opción</option>
          <optgroup th:each="cat : ${@opcionesNecesidad.subcategoriasPorCategoria()}" th:label="#{'categoria.' + ${cat.key}}">
            <option th:each="sub : ${cat.value}" th:value="${sub}" th:text="#{'subcategoria.' + ${sub}}">Subcategoría</option>
          </optgroup>
        </select>
        <span class="campo__error" id="subcategoria-error" th:if="${#fields.hasErrors('subcategoria')}" th:errors="*{subcategoria}">Error</span>
      </div>

      <div class="campo">
        <label class="campo__etiqueta" for="unidadMedida">
          <span th:text="#{beneficiaria.necesidades.form.unidad}">Unidad de medida</span>
          <span class="campo__obligatorio" aria-hidden="true">*</span>
        </label>
        <select class="control" id="unidadMedida" th:field="*{unidadMedida}" required
                th:attr="aria-invalid=${#fields.hasErrors('unidadMedida')},
                         aria-describedby=${#fields.hasErrors('unidadMedida')} ? 'unidad-error' : null">
          <option value="" th:text="#{beneficiaria.necesidades.form.elegir}">Elegí una opción</option>
          <option th:each="u : ${@opcionesNecesidad.unidades()}" th:value="${u}" th:text="#{'unidad.' + ${u}}">kg</option>
        </select>
        <span class="campo__error" id="unidad-error" th:if="${#fields.hasErrors('unidadMedida')}" th:errors="*{unidadMedida}">Error</span>
      </div>
    </div>

    <div class="formulario__fila">
      <div class="campo">
        <label class="campo__etiqueta" for="cantidadRequerida">
          <span th:text="#{beneficiaria.necesidades.form.cantidad}">Cantidad requerida</span>
          <span class="campo__obligatorio" aria-hidden="true">*</span>
        </label>
        <input class="control" id="cantidadRequerida" type="number" step="any" min="0" inputmode="decimal"
               th:field="*{cantidadRequerida}" required
               th:attr="aria-invalid=${#fields.hasErrors('cantidadRequerida')},
                        aria-describedby=${#fields.hasErrors('cantidadRequerida')} ? 'cantidad-error' : null">
        <span class="campo__error" id="cantidad-error" th:if="${#fields.hasErrors('cantidadRequerida')}" th:errors="*{cantidadRequerida}">Error</span>
      </div>

      <div class="campo" th:if="${form.esRecurrente()}">
        <label class="campo__etiqueta" for="periodicidad">
          <span th:text="#{beneficiaria.necesidades.form.periodicidad}">Periodicidad</span>
          <span class="campo__obligatorio" aria-hidden="true">*</span>
        </label>
        <select class="control" id="periodicidad" th:field="*{periodicidad}" required
                th:attr="aria-invalid=${#fields.hasErrors('periodicidad')},
                         aria-describedby=${#fields.hasErrors('periodicidad')} ? 'periodicidad-error' : null">
          <option value="" th:text="#{beneficiaria.necesidades.form.elegir}">Elegí una opción</option>
          <option th:each="p : ${@opcionesNecesidad.periodicidades()}" th:value="${p}" th:text="#{'beneficiaria.periodicidad.' + ${p}}">Mensual</option>
        </select>
        <span class="campo__error" id="periodicidad-error" th:if="${#fields.hasErrors('periodicidad')}" th:errors="*{periodicidad}">Error</span>
      </div>

      <div class="campo" th:unless="${form.esRecurrente()}">
        <label class="campo__etiqueta" for="tipoExtraordinario">
          <span th:text="#{beneficiaria.necesidades.form.situacion}">Situación</span>
          <span class="campo__obligatorio" aria-hidden="true">*</span>
        </label>
        <select class="control" id="tipoExtraordinario" th:field="*{tipoExtraordinario}" required
                th:attr="aria-invalid=${#fields.hasErrors('tipoExtraordinario')},
                         aria-describedby=${#fields.hasErrors('tipoExtraordinario')} ? 'situacion-error' : null">
          <option value="" th:text="#{beneficiaria.necesidades.form.elegir}">Elegí una opción</option>
          <option th:each="t : ${@opcionesNecesidad.tiposExtraordinarios()}" th:value="${t}" th:text="#{'beneficiaria.extraordinario.' + ${t}}">Inundación</option>
        </select>
        <span class="campo__error" id="situacion-error" th:if="${#fields.hasErrors('tipoExtraordinario')}" th:errors="*{tipoExtraordinario}">Error</span>
      </div>
    </div>

    <div class="formulario__acciones">
      <a class="boton boton--secundario" th:href="@{/beneficiaria/necesidades}" th:text="#{accion.cancelar}">Cancelar</a>
      <button type="submit" class="boton boton--primario" th:text="#{accion.guardar}">Guardar</button>
    </div>
  </form>
</th:block>
</body>
</html>
